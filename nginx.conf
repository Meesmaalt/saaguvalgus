server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static uploads directory
    location /uploads/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Prevent HTML 405 error on static server when frontend calls /api
    location /api/ {
        default_type application/json;
        return 404 '{"error": "Static hosting mode - client fallback active"}';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
