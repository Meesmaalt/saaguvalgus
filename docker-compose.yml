services:
  saaguvalgus-app:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: saaguvalgus_web
    restart: unless-stopped
    ports:
      - "3002:80"
    environment:
      NODE_ENV: production
      PORT: 80
      DATA_DIR: /var/lib/saaguvalgus/data
      UPLOADS_DIR: /var/lib/saaguvalgus/uploads
      # Used only when initializing a NEW database; existing password is retained.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - saaguvalgus-data:/var/lib/saaguvalgus/data
      - saaguvalgus-uploads:/var/lib/saaguvalgus/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/api/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

# Explicit names remain stable across Portainer checkout paths and stack names.
volumes:
  saaguvalgus-data:
    name: saaguvalgus-data
  saaguvalgus-uploads:
    name: saaguvalgus-uploads
